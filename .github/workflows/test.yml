name: Lint and test

# merge_group is required: a required check that never reports on the queue's
# branch leaves the queue waiting indefinitely.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# check-version has been replaced by the require-version-label gate in
# version-label.yml. See the Merge queue section of README.md.
jobs:
  static-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@merge-queue-versioning
    permissions:
      security-events: write
    with:
      matrix_commands: '["start"]'
      enable_semgrep_action: true
      enable_trufflehog_action: true
      semgrep_extra_args: '--config="p/default"'
      semgrep_upload_type: "sarif"
      trufflehog_extra_args: "--results=verified,unknown --log-level=2"

  tests-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-npm.yml@merge-queue-versioning
    permissions:
      pull-requests: write
    with:
      coverage: false
      docker_compose_file: ''
      npm_build_command: 'npm run start'
      tests: '["test:init"]'

  tests-e2e:
    uses: digicatapult/shared-workflows/.github/workflows/tests-e2e-poetry.yml@main
    needs: [tests-poetry, tests-npm]
    permissions:
      contents: read
    with:
      docker_compose_file: ''
      setup_node: true
      pre_test_command: 'npm ci && npx playwright install-deps && npx playwright install'
      test_command: 'E2E_TARGET=node npm run test:playwright && E2E_TARGET=python npm run test:playwright'

  static-checks-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-poetry.yml@merge-queue-versioning
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      matrix_commands: '["pylint hello_world index.py tests", "black --check .", "ruff check .", "mypy hello_world/", "bandit -r hello_world"]'
      enable_semgrep_action: true
      enable_trufflehog_action: true
      semgrep_extra_args: '--config="p/default"'
      semgrep_upload_type: "sarif"
      trufflehog_extra_args: "--results=verified,unknown --log-level=2"

  tests-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/tests-poetry.yml@merge-queue-versioning
    permissions:
      contents: read
    with:
      coverage: true
      docker_compose_file: ''
      tests: '["tests/unit"]'

  migration-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-npm.yml@merge-queue-versioning
    permissions:
      contents: read
    with:
      seed_command: 'npm run db:seed'

  migration-checks-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-poetry.yml@merge-queue-versioning
    permissions:
      contents: read

  build-docker-npm:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@merge-queue-versioning
    needs: [static-checks-npm, tests-npm, tests-e2e, migration-checks-npm]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      docker_file: Dockerfile
      scan_container: false
      fail_on_same_version: false

  build-docker-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@merge-queue-versioning
    needs: [static-checks-poetry, tests-poetry, tests-e2e, migration-checks-poetry]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      docker_file: Dockerfile.poetry
      scan_container: false
      fail_on_same_version: false

  generate-sbom-npm:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom.yml@main
    permissions: {}
    needs: [build-docker-npm]
    with:
      enable_check_version: true
      enable_dtrack_project: true
      sbom_output_file: ${{ github.event.repository.name }}-npm.cdx.json
    secrets:
      DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
      DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}
      DTRACK_PARENT_GUID: ${{ secrets.DTRACK_PARENT_GUID }}

  generate-sbom-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom.yml@main
    permissions: {}
    needs: [build-docker-poetry]
    with:
      package_manager: poetry
      sbom_tool: "@cyclonedx/cdxgen"
      install_python_deps: true
      python_version: "3.14"
      additional_args: "--spec-version 1.5 --type python"
      enable_check_version: true
      enable_dtrack_project: true
      sbom_output_file: ${{ github.event.repository.name }}-poetry.cdx.json
    secrets:
      DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
      DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}
      DTRACK_PARENT_GUID: ${{ secrets.DTRACK_PARENT_GUID }}
