name: Lint and test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    uses: digicatapult/shared-workflows/.github/workflows/check-version.yml@feature/upload_artifacts_as_release_assets
    permissions: {}

  static-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@feature/upload_artifacts_as_release_assets
    permissions:
      security-events: write
    with:
      matrix_commands: '["start"]'
      enable_semgrep_action: true
      enable_trufflehog_action: true
      semgrep_extra_args: '--config="p/default"'
      semgrep_upload_type: "sarif"
      trufflehog_extra_args: "--results=verified,unknown --log-level=2"

  tests-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-npm.yml@feature/upload_artifacts_as_release_assets
    permissions:
      pull-requests: write
    with:
      coverage: false
      docker_compose_file: ''
      npm_build_command: 'npm run start'
      tests: '["test:init"]'

  tests-e2e:
    uses: digicatapult/shared-workflows/.github/workflows/tests-e2e-poetry.yml@feature/upload_artifacts_as_release_assets
    needs: [tests-poetry, tests-npm]
    permissions:
      contents: read
    with:
      docker_compose_file: ''
      setup_node: true
      pre_test_command: 'npm ci && npx playwright install-deps && npx playwright install'
      test_command: 'E2E_TARGET=node npm run test:playwright && E2E_TARGET=python npm run test:playwright'

  static-checks-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-poetry.yml@feature/upload_artifacts_as_release_assets
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      matrix_commands: '["pylint hello_world index.py tests", "black --check .", "ruff check .", "mypy hello_world/", "bandit -r hello_world"]'
      enable_semgrep_action: true
      enable_trufflehog_action: true
      semgrep_extra_args: '--config="p/default"'
      semgrep_upload_type: "sarif"
      trufflehog_extra_args: "--results=verified,unknown --log-level=2"

  tests-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/tests-poetry.yml@feature/upload_artifacts_as_release_assets
    permissions:
      contents: read
    with:
      coverage: true
      docker_compose_file: ''
      tests: '["tests/unit"]'

  migration-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-npm.yml@feature/upload_artifacts_as_release_assets
    permissions:
      contents: read
    with:
      seed_command: 'npm run db:seed'

  migration-checks-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-poetry.yml@feature/upload_artifacts_as_release_assets
    permissions:
      contents: read

  build-docker-npm:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@feature/upload_artifacts_as_release_assets
    needs: [static-checks-npm, tests-npm, tests-e2e, migration-checks-npm]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      docker_file: Dockerfile
      image_name: hello-world-npm
      scan_container: false

  build-docker-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@feature/upload_artifacts_as_release_assets
    needs: [static-checks-poetry, tests-poetry, tests-e2e, migration-checks-poetry]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      docker_file: Dockerfile.poetry
      image_name: hello-world-poetry
      scan_container: false

  generate-sbom-npm:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom.yml@feature/upload_artifacts_as_release_assets
    needs: [build-docker-npm]
    with:
      enable_check_version: true
      enable_dtrack_project: true
      sbom_output_file: ${{ github.event.repository.name }}-npm.cdx.json
    secrets:
      DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
      DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}
      DTRACK_PARENT_GUID: ${{ secrets.DTRACK_PARENT_GUID }}

  attest-sbom-npm:
    needs: generate-sbom-npm
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: read
    uses: digicatapult/shared-workflows/.github/workflows/attest.yml@feature/upload_artifacts_as_release_assets
    with:
      subject-artifact-name: ${{ github.event.repository.name }}-npm.cdx.json

  generate-sbom-poetry:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom.yml@feature/upload_artifacts_as_release_assets
    needs: [build-docker-poetry]
    with:
      package_manager: poetry
      sbom_tool: "@cyclonedx/cdxgen"
      install_python_deps: true
      python_version: "3.14"
      additional_args: "--spec-version 1.5 --type python"
      enable_check_version: true
      enable_dtrack_project: true
      sbom_output_file: ${{ github.event.repository.name }}-poetry.cdx.json
    secrets:
      DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
      DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}
      DTRACK_PARENT_GUID: ${{ secrets.DTRACK_PARENT_GUID }}

  attest-sbom-poetry:
    needs: generate-sbom-poetry
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: read
    uses: digicatapult/shared-workflows/.github/workflows/attest.yml@feature/upload_artifacts_as_release_assets
    with:
      subject-artifact-name: ${{ github.event.repository.name }}-poetry.cdx.json

  attest-images:
    needs: [build-docker-npm, build-docker-poetry, attest-sbom-npm, attest-sbom-poetry]
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: read
    uses: digicatapult/shared-workflows/.github/workflows/attest.yml@feature/upload_artifacts_as_release_assets
    with:
      image-matrix: |
        hello-world-npm
        hello-world-poetry
      predicate-matrix: |
        sbom

  stage-release-assets:
    needs: [build-docker-npm, build-docker-poetry, generate-sbom-npm, generate-sbom-poetry]
    permissions:
      actions: read
    uses: digicatapult/shared-workflows/.github/workflows/stage-release-assets.yml@feature/upload_artifacts_as_release_assets
    with:
      get_sbom: true
      expected_sbom_count: 2

  attest-checksums:
    needs: [stage-release-assets]
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: read
    uses: digicatapult/shared-workflows/.github/workflows/attest.yml@feature/upload_artifacts_as_release_assets
    with:
      subject-checksums-artifact-name: ${{ needs.stage-release-assets.outputs.artifact_name }}
