name: Release

on:
  push:
    branches: ['main']

jobs:
  static-checks-npm:
    permissions:
      security-events: write
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@test/permissions_logic
    with:
      matrix_commands: '["start", "stop"]'

  generate-sbom-npm:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom-npm.yml@test/permissions_logic
    permissions:
      contents: read
    with:
      enable_check_version: true
      enable_dtrack_project: true
      sbom_output_file: ${{ github.event.repository.name }}.cdx.json
    secrets:
      DTRACK_APIKEY: ${{ secrets.DTRACK_APIKEY }}
      DTRACK_HOSTNAME: ${{ secrets.DTRACK_HOSTNAME }}

  build-docker:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@test/permissions_logic
    with:
      push_dockerhub: true
      push_ghcr: true
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.SQNC_DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.SQNC_DOCKERHUB_USERNAME }}

  release-github:
    needs:
      - build-docker
      - generate-sbom-npm
    uses: digicatapult/shared-workflows/.github/workflows/release-github.yml@test/permissions_logic
    with:
      get_sbom: true
    permissions:
      contents: write
      pull-requests: read
    secrets: inherit
