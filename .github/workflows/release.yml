name: Release

on:
  push:
    branches: ['main']

jobs:
  static-checks-npm:
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@renovate/major-github-actions-updates
    permissions:
      security-events: write
    with:
      matrix_commands: '["start"]'

  tests-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-npm.yml@renovate/major-github-actions-updates
    permissions:
      pull-requests: write
    with:
      docker_compose_file: ''
      npm_build_command: 'npm run start'
      tests: '["test:init"]'

  tests-e2e-npm:
    uses: digicatapult/shared-workflows/.github/workflows/tests-e2e-npm.yml@renovate/major-github-actions-updates
    permissions: {}
    with:
      docker_compose_file: ''
      pre_test_command: 'npm ci && npx playwright install-deps && npx playwright install'
      test_command: 'npm run test:playwright || exit 1'

  build-docker:
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@renovate/major-github-actions-updates
    needs: [static-checks-npm, tests-npm, tests-e2e-npm]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      push_dockerhub: false
      push_ghcr: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.SQNC_DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.SQNC_DOCKERHUB_USERNAME }}

  generate-sbom-npm:
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom-npm.yml@renovate/major-github-actions-updates
    permissions: {}
    needs: [build-docker]

  release-github:
    uses: digicatapult/shared-workflows/.github/workflows/release-github.yml@renovate/major-github-actions-updates
    permissions:
      contents: write
      pull-requests: read
    needs: [build-docker, generate-sbom-npm]
    with:
      get_sbom: true
    secrets: inherit
