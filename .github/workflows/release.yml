name: Release

# Releases the version commit rather than the merge commit.
#
# Under merge queue versioning the version is not on the pull request branch, it
# is applied to main after merge by apply-version.yml. A merge therefore
# produces two runs on main:
#
#   1. the merge commit    -> apply-version.yml pushes a version commit,
#                             everything here is skipped
#   2. the version commit  -> apply-version.yml is skipped, everything here runs
#
# The guard on each job below is the second half of that pair, and is what stops
# the two workflows triggering each other indefinitely. It has to be on every
# job: build-docker, generate-sbom and release-github all read the version out
# of the checked out tree, so releasing the merge commit would build and tag the
# previous version and publish nothing new.
#
# Both workflows must agree on the 'chore(release):' prefix.
on:
  push:
    branches: ['main']

jobs:
  static-checks-npm:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/static-checks-npm.yml@main
    permissions:
      security-events: write
    with:
      matrix_commands: '["start"]'

  tests-npm:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/tests-npm.yml@merge-queue-versioning
    permissions:
      pull-requests: write
    with:
      docker_compose_file: ''
      npm_build_command: 'npm run start'
      tests: '["test:init"]'

  tests-e2e-npm:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/tests-e2e-npm.yml@main
    permissions: {}
    with:
      docker_compose_file: ''
      pre_test_command: 'npm ci && npx playwright install-deps && npx playwright install'
      test_command: 'E2E_TARGET=node npm run test:playwright || exit 1'

  migration-checks-npm:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-npm.yml@merge-queue-versioning
    permissions:
      contents: read
    with:
      seed_command: 'npm run db:seed'

  migration-checks-poetry:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/migration-checks-poetry.yml@merge-queue-versioning
    permissions:
      contents: read

  build-docker:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/build-docker.yml@main
    needs: [static-checks-npm, tests-npm, tests-e2e-npm, migration-checks-npm, migration-checks-poetry]
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      scan_container: false
      push_dockerhub: false
      push_ghcr: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.SQNC_DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.SQNC_DOCKERHUB_USERNAME }}

  generate-sbom-npm:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/generate-sbom.yml@main
    permissions: {}
    needs: [build-docker]

  release-github:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: digicatapult/shared-workflows/.github/workflows/release-github.yml@main
    permissions:
      contents: write
      pull-requests: read
    needs: [build-docker, generate-sbom-npm]
    with:
      get_sbom: true
