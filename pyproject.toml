[tool.poetry]
name = "hello-world"
version = "2.0.3"
description = "A minimal Python/Poetry hello world web server"
authors = ["Digital Catapult"]
readme = "README.md"
packages = [{ include = "hello_world" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.139.2"
uvicorn = { version = "^0.51.0", extras = ["standard"] }
sqlalchemy = "^2.0.51"
alembic = "^1.18.5"
psycopg = { version = "^3.3.4", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
httpx = "^0.28.0"
coverage = "^7.6.0"
black = "^26.3.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
pylint = "^3.3.0"
bandit = "^1.7.10"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "too-few-public-methods",
]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
