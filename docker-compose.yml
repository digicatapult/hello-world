# Minimal Postgres for the migration-checks canary jobs (both stacks).
# The migration-checks shared workflows bring up this `postgres` service so
# the CI database version tracks what a real consumer would run.
services:
  postgres:
    container_name: hello-world-postgres
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: on-failure
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hello-world
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "hello-world"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 0s
